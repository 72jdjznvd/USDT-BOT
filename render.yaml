services:
  - type: web
    name: usdt-p2p-az
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: BUY_RATE
        value: "1.70"
      - key: SELL_RATE
        value: "1.69"
      - key: PAYMENT_MINUTES
        value: "3"
      - key: BANK_DETAILS
        sync: false
      - key: SELL_TRC20_ADDRESS
        sync: false
      - key: OPERATOR_CHAT_ID
        sync: false
