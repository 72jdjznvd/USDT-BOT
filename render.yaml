services:
  - type: web
    name: usdt-p2p-az
    runtime: python
    plan: free

    buildCommand: pip install -r requirements.txt
    startCommand: python main.py

    healthCheckPath: /health

    envVars:
      - key: BOT_TOKEN
        sync: false

      - key: ADMIN_IDS
        sync: false

      - key: BUY_RATE
        value: "1.70"

      - key: SELL_RATE
        value: "1.65"

      - key: PAYMENT_MINUTES
        value: "15"

      - key: DEFAULT_LANGUAGE
        value: az

      - key: SELL_TRC20_ADDRESS
        sync: false

      - key: TRON_API_KEY
        sync: false

      - key: BANK_DETAILS
        sync: false

      - key: M10_DETAILS
        sync: false
